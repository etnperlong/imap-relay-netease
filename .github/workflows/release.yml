name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BINARY: imap-relay-netease
  RUST_VERSION: '1.100.0'

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || !github.event.deleted
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate release version
        id: version
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er --arg name "$BINARY" '.packages[] | select(.name == $name) | .version')
          tag="v$version"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*)?$ ]] || (( ${#tag} > 128 )); then
            echo 'Expected a SemVer version without build metadata, fitting a Docker tag.' >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Git tag must match the package version ($tag)." >&2
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          printf 'tag=%s\nprerelease=%s\nimage=ghcr.io/%s\n' \
            "$tag" "$prerelease" "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  binaries:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-26.04, target: x86_64-unknown-linux-musl}
          - {runner: ubuntu-26.04-arm, target: aarch64-unknown-linux-musl}
          - {runner: windows-2025-vs2026, target: x86_64-pc-windows-msvc}
          - {runner: windows-11-arm, target: aarch64-pc-windows-msvc}
          - {runner: macos-26-intel, target: x86_64-apple-darwin}
          - {runner: macos-26, target: aarch64-apple-darwin}
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build and verify linkage
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          export RUSTFLAGS='-C strip=symbols'
          if [[ "$RUNNER_OS" != macOS ]]; then
            RUSTFLAGS+=' -C target-feature=+crt-static'
          fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            target_env=${TARGET//-/_}
            export "CC_$target_env=musl-gcc" "CARGO_TARGET_${target_env^^}_LINKER=musl-gcc"
          fi
          cargo "+$RUST_VERSION" build --locked --release --target "$TARGET" --bin "$BINARY"
          executable="target/$TARGET/release/$BINARY"
          case "$RUNNER_OS" in
            Linux)
              dependencies=$(readelf -lWd "$executable")
              if grep -Eq 'INTERP|\(NEEDED\)' <<< "$dependencies"; then
                echo 'Linux binary is not fully static.' >&2
                exit 1
              fi
              ;;
            Windows)
              dependencies=$(llvm-readobj --coff-imports "$executable.exe")
              if grep -Eiq 'Name: (api-ms-win-crt-|ucrtbase|msvcrt|vcruntime|msvcp)' <<< "$dependencies"; then
                echo 'Windows binary imports a dynamic C runtime.' >&2
                exit 1
              fi
              ;;
            macOS)
              dependencies=$(otool -L "$executable")
              awk 'NR > 1 && $1 !~ /^\/(usr\/lib|System\/Library\/Frameworks)\// { print; bad=1 } END { exit bad }' <<< "$dependencies"
              ;;
          esac
      - name: Package binary and license
        shell: bash
        run: |
          archive="$BINARY-$TAG-$TARGET"
          executable="$BINARY"
          if [[ "$RUNNER_OS" == Windows ]]; then executable+=.exe; fi
          mkdir -p dist package
          cp "target/$TARGET/release/$executable" LICENSE package/
          if [[ "$RUNNER_OS" == Windows ]]; then
            (cd package && 7z a "../dist/$archive.zip" "$executable" LICENSE)
          else
            tar -czf "dist/$archive.tar.gz" -C package "$executable" LICENSE
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  image:
    name: Build and publish multi-arch image
    needs: [prepare, binaries]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Generate image metadata
        uses: docker/metadata-action@v6.2.0
        id: metadata
        with:
          images: ${{ needs.prepare.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && needs.prepare.outputs.prerelease == 'false' }}
      - name: Build image and push on tag
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
      - name: Verify published image platforms
        if: github.event_name == 'push'
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}
        run: |
          docker buildx imagetools inspect --raw "$IMAGE" |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: [prepare, binaries, image]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Generate SHA-256 checksums
        shell: bash
        working-directory: dist
        run: |
          shopt -s nullglob
          archives=( *.tar.gz *.zip )
          if (( ${#archives[@]} != 6 )); then
            echo 'Expected six binary archives.' >&2
            exit 1
          fi
          sha256sum -- "${archives[@]}" > SHA256SUMS
      - uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          make_latest: ${{ needs.prepare.outputs.prerelease == 'false' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          body: |
            **Downloads:** Linux (fully static musl), Windows (static CRT), and macOS (system libraries only), all for AMD64 and ARM64. Verify archives with `SHA256SUMS`.

            **Container (Linux AMD64/ARM64):**
            ```sh
            docker pull ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}
            ```
